name: tmp-refresh-r2-env
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: [self-hosted, hatch-vm]
    steps:
      - name: Write R2 pair to runner temp
        run: |
          umask 077
          printf 'export R2_ACCESS_KEY_ID=%s\nexport R2_SECRET_ACCESS_KEY=%s\n' \
            "${{ secrets.R2_ACCESS_KEY_ID }}" "${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            > "$RUNNER_TEMP/r2-env-new"
          chmod 600 "$RUNNER_TEMP/r2-env-new"
          echo "wrote file to: $RUNNER_TEMP/r2-env-new"
