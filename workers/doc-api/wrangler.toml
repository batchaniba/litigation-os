# Cloudflare Worker: litigation portfolio document + data API
# Reads R2 via a *binding* — no keys or secrets anywhere in this repo.

name = "litigation-doc-api"
main = "src/index.mjs"
compatibility_date = "2026-09-17"
# PUBLIC_READ and similar are set on the live Worker, not in this file.
# Keep them across deploys instead of letting this file wipe them.
keep_vars = true

[[r2_buckets]]
binding = "DOCS"
bucket_name = "litigation-documents"

[[d1_databases]]
binding = "DB"
database_name = "litigation-portfolio"
# The live database (created 2026-09-17). An id, not a credential. A
# placeholder here would detach D1 from the Worker on the next deploy.
database_id = "5e920ba3-722d-448d-93ca-304c1e31bee9"

# No cron triggers. The daily deadline digest moved to the portfolio-gate
# Worker (workers/portfolio-gate/src/digest.mjs), which reads clocks.json on
# main. The old digest here read one next_clock per matter from this D1
# projection, which drifts between manual reseeds.
