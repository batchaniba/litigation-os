name: Documents

# Hash / magic / orphan checks against origin/documents (the PDF store),
# not the main checkout. Runs when the inventory or the store-sync scripts
# change. See internal/docs/DOCUMENT_STORE.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  documents-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkout document store
        uses: ./.github/actions/checkout-documents

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate derived data files
        run: node internal/scripts/sync-matter-summaries.mjs

      - name: Verify document tree against manifest
        run: node internal/scripts/validate-portfolio.mjs
