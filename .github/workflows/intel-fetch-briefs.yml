name: Intel Fetch Briefs

# Surgical RECAP brief fetcher. Downloads filed papers for specific docket
# entries (e.g. opposing counsel's Rule 12 briefs) and commits the PDFs to the
# `documents` branch (the filed-paper store). Never writes to main.

on:
  workflow_dispatch:
    inputs:
      docket_number:
        description: 'Docket number (e.g. "5:25-cv-02931")'
        required: true
        type: string
      court:
        description: 'CourtListener court id (e.g. "cacd", "njd"); blank to auto-match'
        required: false
        type: string
      entries:
        description: 'Entry numbers CSV (e.g. "64,68,69,75") or "list" (discover entries, no downloads)'
        required: true
        type: string
      label:
        description: 'Output folder label (e.g. "ventura-randstad")'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: intel-fetch-briefs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check CourtListener token
        run: |
          if [ -z "${{ secrets.COURTLISTENER_TOKEN1 || secrets.COURTLISTENER_TOKEN }}" ]; then
            echo "::error::COURTLISTENER_TOKEN is not set."
            exit 1
          fi

      - name: Fetch RECAP briefs
        run: |
          node internal/scripts/courtlistener/intel/fetch-recap-briefs.mjs \
            --docket-number "${{ inputs.docket_number }}" \
            --court "${{ inputs.court }}" \
            --entries "${{ inputs.entries }}" \
            --label "${{ inputs.label }}" \
            --out /tmp/briefs
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN1 || secrets.COURTLISTENER_TOKEN }}

      - name: Verify downloads
        if: always()
        run: |
          ls -la /tmp/briefs/${{ inputs.label }}/ || echo "no output dir"
          count=$(ls /tmp/briefs/${{ inputs.label }}/*.pdf 2>/dev/null | wc -l)
          echo "pdf_count=$count"
          if [ -f /tmp/briefs/${{ inputs.label }}/manifest.json ]; then
            echo "--- manifest ---"
            cat /tmp/briefs/${{ inputs.label }}/manifest.json
          fi
          if [ "$count" -eq 0 ]; then
            echo "::warning::no PDFs downloaded; manifest carries the diagnostic"
          fi

      - name: Checkout document store
        if: always()
        uses: actions/checkout@v7
        with:
          ref: documents
          path: docstore
          fetch-depth: 1

      - name: Commit to document store
        if: always()
        run: |
          dest="docstore/internal/public/documents/counsel-briefs/${{ inputs.label }}"
          mkdir -p "$dest"
          cp /tmp/briefs/${{ inputs.label }}/*.pdf "$dest"/ 2>/dev/null || true
          cp /tmp/briefs/${{ inputs.label }}/manifest.json "$dest"/ 2>/dev/null || true
          cd docstore
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "RECAP briefs: ${{ inputs.label }} (${{ inputs.docket_number }})"
            git push origin HEAD:documents
          fi

      - name: Update document manifest
        if: always()
        run: |
          # Base the manifest on the unmerged manifest PR branch when one exists,
          # so concurrent fetches do not clobber each other's entries.
          git fetch origin intel/document-manifest:tmp-manifest-branch 2>/dev/null || true
          if git rev-parse --verify tmp-manifest-branch >/dev/null 2>&1; then
            git show tmp-manifest-branch:internal/src/data/documents/manifest.json \
              > internal/src/data/documents/manifest.json
            echo "based manifest on unmerged intel/document-manifest branch"
          fi
          node internal/scripts/append-document-manifest.mjs \
            --manifest internal/src/data/documents/manifest.json \
            --dir /tmp/briefs/${{ inputs.label }} \
            --prefix /documents/counsel-briefs/${{ inputs.label }}

      - name: Open or update manifest PR
        if: always()
        uses: peter-evans/create-pull-request@v7
        with:
          branch: intel/document-manifest
          delete-branch: false
          title: "Document manifest: counsel briefs ${{ inputs.label }}"
          commit-message: "docs: register counsel-briefs/${{ inputs.label }} in document manifest"
          body: |
            Registers the files landed on the `documents` branch by the Intel Fetch
            Briefs run (`${{ inputs.label }}`, docket `${{ inputs.docket_number }}`)
            in `internal/src/data/documents/manifest.json`, keeping the
            documents-integrity check green.
          add-paths: |
            internal/src/data/documents/manifest.json
