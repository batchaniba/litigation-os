name: Deploy to GitHub Pages

# Pages is the origin for /documents/* (Vercel rewrites there) and a mirror of
# the app. It used to rebuild on every push to main — 100+ times on a busy
# day, mostly for intel memos that change nothing in dist/. Now it runs on a
# schedule that matches the Vercel deploy cron (internal/docs/VERCEL_DEPLOYS.md)
# and on dispatch. `npm run documents:push` dispatches it after uploading new
# PDFs (the `documents` branch carries no workflow file, so a push there
# cannot trigger this directly). The app is always built from main.
on:
  schedule:
    # 06:00 / 12:00 / 18:00 Pacific (13/19/01 UTC during PDT; one hour later in PST).
    - cron: "0 1,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Explicit ref: a push to `documents` would otherwise check out that
      # branch, which has no app source.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout document store
        uses: ./.github/actions/checkout-documents

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate portfolio data
        run: npm run validate

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
