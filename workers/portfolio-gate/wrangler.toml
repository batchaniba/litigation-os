# Phase 2 remote portfolio-gate.
# Containers config matches https://developers.cloudflare.com/containers/get-started/
# (fetched 2026-09-20): containers + durable_objects + migrations.new_sqlite_classes.
# Instance types: https://developers.cloudflare.com/containers/platform-details/limits/

name = "ilp-portfolio-gate"
main = "src/index.mjs"
compatibility_date = "2026-09-20"

# standard-2 = 1 vCPU / 6 GiB / 12 GB disk — npm ci + vitest will OOM on lite/basic.
# One instance. GateOrchestrator FIFO-queues extra SHAs instead of starting
# more 6 GiB containers. Overlapping instances were the bulk of the Sep–Oct
# 2026 Containers bill.
[[containers]]
class_name = "GateRunner"
image = "./Dockerfile"
max_instances = 1
instance_type = "standard-2"

[[durable_objects.bindings]]
name = "GATE_RUNNER"
class_name = "GateRunner"

# Singleton FIFO: one live gate at a time (15-minute alarm wall limit).
# The webhook's ctx.waitUntil() is cancelled 30s after the response, which
# killed every full run and left Check Runs in_progress forever.
[[durable_objects.bindings]]
name = "GATE_ORCHESTRATOR"
class_name = "GateOrchestrator"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "GateRunner" ]

[[migrations]]
tag = "v2"
new_sqlite_classes = [ "GateOrchestrator" ]

# Times are UTC. Keep the sweep string identical to SWEEP_CRON in src/index.mjs.
#   */30 * * * *  fail portfolio-gate checks left in_progress past the timeout
#   8 15 * * *    deadline digest from main's clocks.json, 08:08 PDT / 07:08 PST
#                 (Mondays add the 60-day horizon). Replaces the doc-api D1 digest.
[triggers]
crons = ["*/30 * * * *", "8 15 * * *"]

[observability]
enabled = true

# Secrets are NOT stored here. Operator sets them after creating the GitHub App:
#   wrangler secret put GITHUB_APP_ID
#   wrangler secret put GITHUB_APP_PRIVATE_KEY
#   wrangler secret put GITHUB_WEBHOOK_SECRET
#   wrangler secret put GITHUB_APP_INSTALLATION_ID   # optional; crons look it up from the App if unset
#   wrangler secret put ALERT_WEBHOOK                # where the daily digest is POSTed (JSON with a `text` field)
[vars]
GITHUB_REPO = "newanforbi/interactive-litigation-portfolio"
# Locked Check Run name — branch protection requires this exact string.
CHECK_NAME = "portfolio-gate"
# Fail-closed wall clock (12 minutes). No result → Check Run conclusion `failure`.
# Must stay under the 15-minute Durable Object alarm limit so the failure is
# reported from inside the alarm; the stale sweep covers anything past that.
GATE_TIMEOUT_MS = "720000"
