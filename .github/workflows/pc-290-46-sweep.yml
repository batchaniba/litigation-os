# One-off § 290.46 full-text sweep over CourtListener opinions + RECAP.
#
# Runs here rather than in the agent session because COURTLISTENER_TOKEN is a
# repository secret and the agent container's egress policy blocks
# courtlistener.com. Commits the JSON result back to the research branch.
#
# Triggers only on changes to the sweep script or this file, so the commit it
# makes (which touches only the JSON output) cannot retrigger it.
name: PC 290.46 sweep

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ca-penal-290-46-research-fn3w2x
    paths:
      - internal/scripts/courtlistener/sweep-290-46.mjs
      - .github/workflows/pc-290-46-sweep.yml

permissions:
  contents: write

concurrency:
  group: pc-290-46-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Report token presence
        run: |
          if [ -z "${COURTLISTENER_TOKEN}" ]; then
            echo "::error::COURTLISTENER_TOKEN secret is empty; the sweep needs it for RECAP text search."
            exit 1
          fi
          echo "COURTLISTENER_TOKEN is present (${#COURTLISTENER_TOKEN} chars)."

      - name: Run sweep
        run: node internal/scripts/courtlistener/sweep-290-46.mjs

      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first: git diff ignores untracked files, so diffing before adding
          # reports "no change" on the very first run and silently drops the result.
          git add internal/docs/legal-intel/recon/290-46-recap-sweep.json
          if git diff --cached --quiet; then
            echo "No change in sweep output."
            exit 0
          fi
          git commit -m "chore(intel): CourtListener 290.46 full-text sweep results"
          git push origin HEAD:"${{ github.ref_name }}"
