name: Deadline warnings

on:
  schedule:
    - cron: "0 13 * * *"  # 6am PT daily
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/checkout-documents

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check deadlines
        id: check
        run: |
          node internal/scripts/check-deadlines.mjs --days=7 --format=markdown > warnings.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat warnings.md
        continue-on-error: true

      - name: Create or update warning issue
        if: steps.check.outputs.exit == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('warnings.md', 'utf8');
            const title = '⚠️ Critical deadlines within 3 days';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deadline-warning',
            });
            if (issues.length) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['deadline-warning'],
              });
            }
