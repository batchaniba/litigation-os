version: 2
updates:
  # App and tooling dependencies. Grouped so routine patch bumps arrive as one
  # reviewable PR a week rather than a dozen; majors stay separate because they
  # are the ones that actually need reading.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
        update-types:
          - minor
          - patch
      build-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"
        update-types:
          - minor
          - patch

  # Keeps actions/checkout, setup-node, setup-python, and the Pages actions
  # current — these are the workflow's only unpinned third-party code.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
