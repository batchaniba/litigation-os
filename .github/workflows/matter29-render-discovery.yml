name: Matter 29 — render draft discovery packet

on:
  push:
    branches:
      - matter-29/discovery-set-one-amazon-accurate-2026-10-17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer
          python -m pip install --upgrade pip
          python -m pip install python-docx pypdf
      - name: Render Matter 29 Word, PDF, and archive drafts
        run: python internal/scripts/build_matter29_discovery_packet.py
      - name: Add generated drafts to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/docs/matter-29/discovery-set-one/generated/
          if ! git diff --cached --quiet; then
            git commit -m "matter29: add generated Word and PDF discovery review drafts"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
