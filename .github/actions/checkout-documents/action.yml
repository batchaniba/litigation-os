name: Checkout document store
description: Checks out the documents branch and places PDFs under internal/public/documents/

runs:
  using: composite
  steps:
    - name: Checkout document store
      uses: actions/checkout@v7
      with:
        ref: documents
        fetch-depth: 1
        path: .document-store

    - name: Place PDFs
      shell: bash
      run: |
        rm -rf internal/public/documents
        mkdir -p internal/public
        mv .document-store/internal/public/documents internal/public/documents
        rm -rf .document-store
