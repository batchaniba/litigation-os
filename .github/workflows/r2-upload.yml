name: R2 Document Upload

# Upload-only mirror: PDFs on the `documents` branch → Cloudflare R2
# `litigation-documents`. Never deletes from R2. Key scheme:
# sha256/<first2>/<rest>.pdf (same as the 2026-09-17 migration).
# The manifest on main stays the index; this workflow only moves bytes.
#
# House-rule exception (AGENTS.md): the only non-CourtListener Actions
# workflow besides the intel/counsel jobs, approved 2026-09-16.
# Uploader is Node (`internal/scripts/r2-upload.mjs`), not Python.
#
# Push-to-documents only fires if this YAML is also on `documents`.
# `workflow_dispatch` from main works immediately (checks out both refs).

on:
  push:
    branches: [documents]
    paths:
      - "internal/public/documents/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-upload-documents
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Checkout documents branch (PDFs)
        uses: actions/checkout@v7
        with:
          ref: documents
          path: docs-tree
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /internal/public/documents/

      - name: Checkout main (uploader)
        uses: actions/checkout@v7
        with:
          ref: main
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /internal/scripts/r2-upload.mjs
            /internal/scripts/lib/r2-client.mjs
            /internal/scripts/lib/document-store.mjs
            /internal/src/data/documents/manifest.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect PDFs to upload
        working-directory: docs-tree
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || [ -z "$BEFORE" ] \
             || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git ls-files 'internal/public/documents/**' | grep -i '\.pdf$' > /tmp/upload-list.txt || true
          else
            git diff --name-only --diff-filter=ACM "$BEFORE" "${{ github.sha }}" \
              -- 'internal/public/documents/**' | grep -i '\.pdf$' > /tmp/upload-list.txt || true
          fi
          wc -l /tmp/upload-list.txt

      - name: Upload to R2
        env:
          REPO_ROOT: ${{ github.workspace }}/docs-tree
        run: node src/internal/scripts/r2-upload.mjs --list /tmp/upload-list.txt

      - name: Publish path → sha256 index
        env:
          REPO_ROOT: ${{ github.workspace }}/src
        run: node src/internal/scripts/r2-upload.mjs --index
