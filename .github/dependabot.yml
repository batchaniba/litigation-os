version: 2
updates:
  # App and tooling dependencies.
  #
  # Conflict hygiene while humans work in parallel on main:
  # - rebase-strategy: auto — Dependabot rebases when a PR conflicts after
  #   pushes to main (default, made explicit so it cannot drift).
  # - Groups collapse routine minor/patch noise into a few weekly PRs.
  # - Peer-locked majors (React stack, Vitest stack) are grouped so Dependabot
  #   cannot open half-upgrades that fail npm ci.
  # - TypeScript majors ignored until typescript-eslint supports TS 7+.
  # - open-pull-requests-limit keeps the queue short so stale branches are
  #   less likely to pile up against active feature work.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    rebase-strategy: auto
    groups:
      dev-tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@testing-library/*"
          - "jsdom"
          - "globals"
        update-types:
          - minor
          - patch
      build-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"
        update-types:
          - minor
          - patch
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      # Keep peer-locked majors together (prevents #457/#459 and #458 splits).
      vitest-stack:
        patterns:
          - "vitest"
          - "@vitest/*"
      # react-router joined this group at v8: it dropped the react-router-dom
      # shim and now peers react/react-dom directly (>=19.2.7 as of 8.3.0), so a
      # router major that outruns the React majors cannot install cleanly.
      react-stack:
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # typescript-eslint@8 peers typescript <6.1; TS 7 cannot install cleanly yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Keeps actions/checkout, setup-node, setup-python, and the Pages actions
  # current — these are the workflow's only unpinned third-party code.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    rebase-strategy: auto
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    rebase-strategy: auto
    groups:
      python-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
