# Phone-only owner exception: production Worker / D1 / R2 deploys.
# This is NOT test CI. Do not add lint, typecheck, vitest, or portfolio-gate
# jobs here — those stay in .githooks/pre-push and workers/portfolio-gate/.
#
# MCP is the /mcp route on litigation-doc-api, not a second Worker.
# Never apply seed.sql / POST /admin/reseed from this workflow.

name: Cloudflare deploy

on:
  push:
    branches: [main]
    paths:
      - "workers/doc-api/**"
      - "documents/**"
      - "internal/scripts/sync-canonical-store.mjs"
      - "internal/scripts/r2-upload.mjs"
      - "internal/scripts/lib/r2-client.mjs"
      - "internal/scripts/lib/document-store.mjs"
      - "internal/scripts/lib/private-documents.mjs"
      - "internal/scripts/lib/doc-text.mjs"
      - "internal/src/data/documents/private-documents.json"
      - "internal/src/data/documents/manifest.json"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: Skip Worker deploy and D1 schema (sync only)
        type: boolean
        default: false
      skip_sync:
        description: Skip documents:sync even if R2 secrets exist
        type: boolean
        default: false

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_VERSION: "4"
  D1_NAME: litigation-portfolio
  D1_ID: 5e920ba3-722d-448d-93ca-304c1e31bee9
  R2_BUCKET: litigation-documents
  PUBLIC_READ: "true"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      sync: ${{ steps.decide.outputs.sync }}
    steps:
      - name: Decide which jobs to run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SKIP_DEPLOY: ${{ github.event.inputs.skip_deploy }}
          SKIP_SYNC: ${{ github.event.inputs.skip_sync }}
        run: |
          set -euo pipefail
          deploy=false
          sync=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [ "${SKIP_DEPLOY:-false}" != "true" ] && deploy=true
            [ "${SKIP_SYNC:-false}" != "true" ] && sync=true
            echo "workflow_dispatch deploy=$deploy sync=$sync"
            echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
            echo "sync=$sync" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          zero="0000000000000000000000000000000000000000"
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "$zero" ]; then
            echo "No previous SHA; running deploy + sync"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! files=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${GITHUB_SHA}" --paginate --jq '.files[].filename' 2>/dev/null); then
            echo "::warning::Could not list changed files; running deploy + sync"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$files"

          if echo "$files" | grep -Eq '^(workers/doc-api/|\.github/workflows/cloudflare-deploy\.yml$)'; then
            deploy=true
          fi
          if echo "$files" | grep -Eq '^(\.github/workflows/cloudflare-deploy\.yml$|documents/|internal/scripts/sync-canonical-store\.mjs$|internal/scripts/r2-upload\.mjs$|internal/scripts/lib/(r2-client|document-store|private-documents|doc-text)\.mjs$|internal/src/data/documents/(private-documents|manifest)\.json$)'; then
            sync=true
          fi

          echo "push deploy=$deploy sync=$sync"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "sync=$sync" >> "$GITHUB_OUTPUT"

  secrets:
    name: Check required secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if Cloudflare secrets are missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error title=Missing repo secret::CLOUDFLARE_API_TOKEN is empty. On iPhone Safari (Request Desktop Website): repo → Settings → Secrets and variables → Actions → New repository secret. Token permissions: see internal/docs/CI_CLOUDFLARE_DEPLOY.md"
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error title=Missing repo secret::CLOUDFLARE_ACCOUNT_ID is empty. Cloudflare dashboard → Workers → Overview (right sidebar) or any domain's Overview. Same value as the R2 account id."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Required secrets are missing. Workflow will not deploy or apply D1 schema. Add the secrets, then Actions → Cloudflare deploy → Run workflow."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set."

  deploy:
    name: Deploy worker + D1 schema
    needs: [plan, secrets]
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers/doc-api
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            workers/doc-api
          sparse-checkout-cone-mode: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply D1 schema (idempotent, never reseed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # schema.sql is CREATE TABLE / INDEX / VIRTUAL TABLE IF NOT EXISTS.
          # Safe to re-run. Does not DELETE or DROP data.
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "${D1_NAME}" \
            --remote --yes --file=schema.sql

          if [ -d migrations ]; then
            shopt -s nullglob
            for f in migrations/*.sql; do
              echo "Applying $f"
              npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "${D1_NAME}" \
                --remote --yes --file="$f"
            done
          fi

          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "${D1_NAME}" \
            --remote --yes --json \
            --command "SELECT name FROM sqlite_master WHERE name IN ('documents_fts','documents','matters','clocks') ORDER BY name;"

      - name: Deploy litigation-doc-api (REST + MCP)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # keep_vars = true in wrangler.toml so dashboard vars survive.
          # Do not put PUBLIC_READ in [vars] or --var: it may already be a
          # Worker secret (wrangler secret put PUBLIC_READ). Secrets persist
          # across deploy. Do not run wrangler secret delete / put here.
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy
          echo "PUBLIC_READ must stay true on the live Worker (existing secret/var). This deploy does not clear it."

      - name: Smoke-check health and MCP
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
            "https://litigation-doc-api.ss8sxswwkt.workers.dev/health"
          echo
          curl -fsS --retry 3 --retry-delay 2 \
            -X POST "https://litigation-doc-api.ss8sxswwkt.workers.dev/mcp" \
            -H "content-type: application/json" \
            -H "accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"github-actions","version":"0"}}}'
          echo

  sync:
    name: Sync documents to R2
    needs: [plan, secrets]
    if: needs.plan.outputs.sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pdftotext (text sidecars)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: documents:sync --apply (skip if R2 secrets missing)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ env.R2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ]; then
            echo "::warning title=R2 secrets missing::R2_ACCESS_KEY_ID and/or R2_SECRET_ACCESS_KEY are not set. Skipping documents:sync. Worker deploy is unaffected. Add both R2 secrets (S3 API token scoped to litigation-documents), then Actions → Cloudflare deploy → Run workflow."
            exit 0
          fi
          if [ -z "${R2_ACCOUNT_ID}" ]; then
            echo "::error title=Missing account id::CLOUDFLARE_ACCOUNT_ID is required as R2_ACCOUNT_ID for the S3 API."
            exit 1
          fi
          echo "Running npm run documents:sync -- --apply (upload-only; never DELETE/DROP; no D1 reseed)"
          npm run documents:sync -- --apply
