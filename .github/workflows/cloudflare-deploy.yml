# Deploys workers/doc-api to Cloudflare when it changes on main.
# Approved 2026-09-17 (AGENTS.md "No CI — the gate is local" exception).
#
# Required repo secret: CLOUDFLARE_API_TOKEN (custom token, Account scope:
# Workers Scripts Edit + D1 Edit). Workflow-only: GitHub injects it at
# deploy time; no agent, chat message, or file ever sees the value.
# The D1 database_id is resolved by name at deploy time so it never
# lives in the repo (wrangler.toml keeps its placeholder).
name: Cloudflare Worker deploy

on:
  push:
    branches: [main]
    paths: ["workers/doc-api/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve D1 database_id by name
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          DB_ID=$(npx -y wrangler@4 d1 list --json | node -e "
            let s = '';
            process.stdin.on('data', (d) => (s += d)).on('end', () => {
              const db = JSON.parse(s).find((x) => x.name === 'litigation-portfolio');
              if (!db) { console.error('D1 database litigation-portfolio not found'); process.exit(1); }
              console.log(db.uuid);
            });
          ")
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${DB_ID}/" workers/doc-api/wrangler.toml
          grep -q "$DB_ID" workers/doc-api/wrangler.toml && echo "database_id resolved"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4 deploy --config workers/doc-api/wrangler.toml
