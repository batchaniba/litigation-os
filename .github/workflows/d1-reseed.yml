# Keeps the Worker's D1 in sync with the repo. When portfolio data merges to
# main, regenerates seed.sql and POSTs it to the Worker's guarded
# /admin/reseed endpoint, which applies it to its own D1 binding.
# Approved 2026-09-17 (AGENTS.md "No CI — the gate is local" exception).
#
# Required repo secret: RESEED_SECRET — must match the Worker's RESEED_SECRET
# secret. Workflow-only: GitHub injects it at run time; no agent, chat
# message, or file ever sees the value. Requests without it get 403.
name: D1 self-reseed

on:
  push:
    branches: [main]
    paths:
      - "internal/src/data/matters/**"
      - "internal/src/data/index/matters.json"
      - "internal/src/data/documents/manifest.json"
      - "workers/doc-api/seed.mjs"
  workflow_dispatch:

jobs:
  reseed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate seed.sql from repo data
        run: node workers/doc-api/seed.mjs > /tmp/seed.sql && wc -l /tmp/seed.sql

      - name: POST seed to Worker
        env:
          RESEED_SECRET: ${{ secrets.RESEED_SECRET }}
        run: |
          curl -sS -X POST https://litigation-doc-api.ss8sxswwkt.workers.dev/admin/reseed \
            -H "Authorization: Bearer ${RESEED_SECRET}" \
            -H "content-type: text/plain" \
            --data-binary @/tmp/seed.sql
