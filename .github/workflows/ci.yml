name: CI

# Runners are paused while GitHub billing/spending limit is blocking jobs.
# Restore push + pull_request when Actions can start again.
on:
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    env:
      # Data jobs do not need the 660 MB PDF tree. Existence is checked
      # against the committed manifest; Vite skips copying documents/.
      # See internal/docs/DOCUMENT_STORE.md.
      PORTFOLIO_SKIP_DISK_DOCS: "1"
      VITE_COPY_DOCUMENTS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          # Everything except the filed-PDF tree. Nested exclude needs the
          # un-cone walk: drop a directory, then put its siblings back.
          sparse-checkout: |
            /*
            !/internal/
            /internal/*
            !/internal/public/
            /internal/public/*
            !/internal/public/documents/

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Match local/dev and jsdom 30+ engines (^22.22 || ^24 || >=26).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate portfolio data (matter JSON, document paths, cross-module coverage)
        run: npm run validate

  python-scripts:
    name: Python document scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # This job only lints and syntax-checks internal/scripts, so it has no
          # reason to pull the ~660 MB document library at all.
          sparse-checkout: |
            internal/scripts
            pyproject.toml

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Lint and syntax-check only. The PDF libraries in requirements.txt are
      # heavy (and pytesseract needs a system binary), and nothing in CI runs
      # the generators, so installing them here would cost minutes for no
      # additional signal.
      # Pinned so a new ruff release cannot turn a green branch red on its own;
      # bump deliberately after running `ruff check .` locally.
      - name: Lint (ruff)
        run: pipx run ruff==0.16.1 check .

      - name: Syntax check
        run: python -m compileall -q internal/scripts
